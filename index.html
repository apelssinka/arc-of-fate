<head>
    <meta charset="UTF-8">

    <meta name="description" content="Arc of Fate — мрачный киберпанк-комикс о девушке, пережившей эксперименты, и бессмертном учёном, который учится быть человеком.">
    <meta name="keywords" content="Arc of Fate, Арка Судьбы, Акихару, NEX, Каролина, научная фантастика, сайт арка судьбы, комикс, киберпанк, веб-комикс, манга">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #00cc66;
            font-family: 'Courier New', 'Fira Code', monospace;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Анимированный фон */
        .code-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            font-family: monospace;
            font-size: 14px;
            color: rgba(0, 204, 102, 0.1);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .code-row {
            white-space: nowrap;
            animation: scrollRow 45s linear infinite;
            width: max-content;
        }
        @keyframes scrollRow {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .glitch-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15) 0px, rgba(0, 0, 0, 0.15) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #00cc66;
            box-shadow: 0 0 20px rgba(0, 204, 102, 0.2);
            padding: 30px;
            border-radius: 8px;
            position: relative;
            z-index: 2;
        }

        h1, h2, h3 {
            color: #ff3366;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #ff3366;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: normal;
        }
        h1 { font-size: 2.5rem; border-bottom: none; text-shadow: 0 0 5px #ff3366; }

        a {
            color: #00cc66;
            text-decoration: none;
            border-bottom: 1px dashed #00cc66;
            transition: 0.3s;
        }
        a:hover { color: #ff3366; border-bottom-color: #ff3366; }

        nav {
            margin: 20px 0;
            padding: 10px 0;
            border-top: 1px solid #00cc66;
            border-bottom: 1px solid #00cc66;
            display: flex;
            gap: 20px;
        }

        /* Общая сетка персонажей */
        .characters-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin: 40px 0;
        }
        .character-card {
            text-align: center;
            cursor: pointer;
            width: 220px;
        }
        .character-frame {
            padding: 15px;
            border: 2px solid #00cc66;
            background: #050505;
            transition: all 0.3s;
        }
        .character-card:hover .character-frame {
            border-color: #ff3366;
            box-shadow: 0 0 15px rgba(255,51,102,0.3);
            transform: translateY(-2px);
        }
        
        /* Превью в плашке (без эффекта проекции) */
        .char-thumb-wrapper {
            width: 100%;
            height: 260px;
            overflow: hidden;
            background: #000;
            position: relative;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 204, 102, 0.3);
        }
        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
            transition: 0.3s;
        }
        .character-card:hover .preview-img {
            opacity: 1;
        }

        .character-name {
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: bold;
            color: #00cc66;
            text-transform: uppercase;
        }
        .character-card:hover .character-name { color: #ff3366; }

        /* ОКНО ПРОЕКЦИИ (HUD MODAL) */
        .hud-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.96);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .hud-modal.active { display: flex; }
        
        .hud-window {
            background: #0a0a0a;
            border: 2px solid #00cc66;
            box-shadow: 0 0 35px rgba(0,204,102,0.25);
            width: 100%;
            max-width: 950px;
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            position: relative;
        }
        @media(max-width: 768px) {
            .hud-window { grid-template-columns: 1fr; }
        }

        .hud-left {
            border-right: 1px dashed rgba(0, 204, 102, 0.4);
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 204, 102, 0.01);
        }
        .hud-right { padding: 30px; position: relative; }

        /* Оболочка голограммы */
        .big-hologram-wrapper {
            width: 100%;
            max-width: 280px;
            height: 360px;
            background: #000;
            border: 2px solid #00cc66;
            position: relative;
            box-shadow: 0 0 20px rgba(0,204,102,0.15);
            overflow: hidden;
        }

        /* ЭФФЕКТ ПРОЕКЦИИ ДЛЯ АРТА */
        .hologram-projection {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: screen; 
            filter: brightness(1.25) contrast(1.3) sepia(1) hue-rotate(85deg) saturate(4.5);
            opacity: 0.9;
            animation: hologramGlitch 3.5s infinite alternate;
        }

        /* Сетка развертки */
        .scanline::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        /* Линия лазера */
        .laser-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0, 204, 102, 0.6);
            box-shadow: 0 0 10px #00cc66;
            animation: scanLaser 4s linear infinite;
            z-index: 3;
            pointer-events: none;
        }
        @keyframes scanLaser {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* Глюки голограммы */
        @keyframes hologramGlitch {
            0% { transform: translate(0) skew(0deg); filter: brightness(1.2) hue-rotate(85deg) saturate(4.5); }
            92% { transform: translate(0) skew(0deg); }
            93% { transform: translate(-2px, 1px) skew(-2deg); filter: brightness(1.5) hue-rotate(60deg); }
            95% { transform: translate(1px, -1px) skew(3deg); }
            96% { transform: translate(0) skew(0deg); filter: brightness(1.2) hue-rotate(85deg) saturate(4.5); }
            98% { transform: translate(3px, 0px) skew(-1deg); filter: brightness(1.4); }
            100% { transform: translate(0) skew(0deg); }
        }

        .close-hud {
            position: absolute;
            top: 15px; right: 20px;
            color: #ff3366;
            font-size: 1.4rem;
            cursor: pointer;
            border: 1px solid #ff3366;
            padding: 0px 8px;
            background: transparent;
        }
        .close-hud:hover { background: #ff3366; color: #000; }

        /* Поля данных HUD */
        .bio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        @media(max-width: 500px) {
            .bio-grid { grid-template-columns: 1fr; }
        }
        .bio-row {
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(0, 204, 102, 0.15);
            padding-bottom: 4px;
        }
        .bio-row.full-width {
            grid-column: 1 / -1;
        }
        .bio-label { color: #ff3366; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; display: block;}
        
        /* Стилизация скроллбара для досье */
        .hologram-desc-box {
            color: #a0ffb0; 
            font-size: 0.9rem; 
            line-height: 1.6; 
            max-height: 240px; 
            overflow-y: auto;
            padding-right: 10px;
            border-left: 2px solid rgba(0, 204, 102, 0.2);
            padding-left: 10px;
        }
        .hologram-desc-box::-webkit-scrollbar {
